<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg-micro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="crimson-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#fca5a5"/>
    </linearGradient>
    <linearGradient id="manning-tag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg-micro)"/>

  <!-- Left Spine Accent -->
  <rect x="0" y="0" width="8" height="600" fill="#ef4444"/>

  <!-- Manning Publisher Tag -->
  <rect x="30" y="28" width="80" height="24" rx="3" fill="url(#manning-tag)"/>
  <text x="70" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">MANNING</text>
  <text x="122" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#fca5a5" letter-spacing="1">ENTERPRISE ARCHITECTURE</text>

  <!-- Main Title Area -->
  <text x="30" y="125" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Patrones de
  </text>
  <text x="30" y="168" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="900" fill="url(#crimson-accent)" letter-spacing="-0.5">
    Microservicios
  </text>

  <!-- Subtitle -->
  <text x="30" y="210" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
    Sistemas Distribuidos y Arquitectura Saga
  </text>
  <text x="30" y="230" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#64748b">
    Descomposición de monolitos, eventos asíncronos y CQRS
  </text>

  <!-- Microservices Hexagonal Cluster Graphic -->
  <g transform="translate(200, 360)">
    <!-- Central Event Bus Ring -->
    <circle cx="0" cy="0" r="85" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4"/>
    <circle cx="0" cy="0" r="26" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
    <text x="0" y="4" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle">EVENT BUS</text>

    <!-- Hexagon 1: Order Service (Top) -->
    <g transform="translate(0, -65)">
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="0" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="6.5" font-weight="700" fill="#ffffff" text-anchor="middle">ORDER</text>
      <line x1="0" y1="18" x2="0" y2="39" stroke="#f87171" stroke-width="1.5"/>
    </g>

    <!-- Hexagon 2: Payment Service (Bottom Right) -->
    <g transform="translate(56, 32)">
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="0" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">PAYMENT</text>
      <line x1="-12" y1="-7" x2="-33" y2="-19" stroke="#f87171" stroke-width="1.5"/>
    </g>

    <!-- Hexagon 3: Catalog Service (Bottom Left) -->
    <g transform="translate(-56, 32)">
      <polygon points="0,-18 16,-9 16,9 0,18 -16,9 -16,-9" fill="#7f1d1d" stroke="#ef4444" stroke-width="1.5"/>
      <text x="0" y="3" font-family="'Plus Jakarta Sans', sans-serif" font-size="6" font-weight="700" fill="#ffffff" text-anchor="middle">CATALOG</text>
      <line x1="12" y1="-7" x2="33" y2="-19" stroke="#f87171" stroke-width="1.5"/>
    </g>
  </g>

  <!-- Key Architecture Callout -->
  <rect x="30" y="475" width="160" height="26" rx="4" fill="#450a0a" stroke="#991b1b" stroke-width="1"/>
  <text x="110" y="492" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="middle" letter-spacing="1">PATRÓN SAGA TRANSACCIONAL</text>

  <!-- Author Area -->
  <rect x="30" y="520" width="340" height="1" fill="#1e293b"/>
  <text x="30" y="548" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">AUTOR &amp; CONSULTOR EN MICROSERVICIOS</text>
  <text x="30" y="574" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#ffffff">
    Chris Richardson
  </text>
</svg>
