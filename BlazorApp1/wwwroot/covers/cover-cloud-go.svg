<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <defs>
    <linearGradient id="bg-go" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="45%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyan-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="oreilly-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg-go)"/>

  <!-- Left Spine Accent -->
  <rect x="0" y="0" width="8" height="600" fill="#06b6d4"/>

  <!-- O'Reilly Top Stripe -->
  <rect x="30" y="28" width="85" height="24" rx="3" fill="url(#oreilly-red)"/>
  <text x="72" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">O'REILLY</text>
  <text x="125" y="44" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="600" fill="#22d3ee" letter-spacing="1">CLOUD NATIVE SERIES</text>

  <!-- Main Title -->
  <text x="30" y="125" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Cloud Native
  </text>
  <text x="30" y="170" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="url(#cyan-accent)" letter-spacing="-0.5">
    Go
  </text>

  <!-- Subtitle -->
  <text x="30" y="212" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">
    Building Web Applications and Microservices
  </text>
  <text x="30" y="232" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="400" fill="#64748b">
    Resilient systems, Docker, Kubernetes &amp; gRPC
  </text>

  <!-- Geometric / Cloud Graphic -->
  <g transform="translate(200, 365)">
    <!-- Cloud Silhouette Outlines -->
    <path d="M-60,20 C-80,20 -95,5 -95,-15 C-95,-32 -82,-46 -65,-48 C-60,-75 -30,-92 5,-85 C30,-78 48,-60 50,-35 C68,-33 82,-18 82,2 C82,22 65,38 45,38 L-60,38 Z" fill="none" stroke="#0891b2" stroke-width="2" stroke-dasharray="4,4" opacity="0.4"/>
    
    <!-- Distributed Nodes Network -->
    <line x1="-50" y1="-20" x2="0" y2="-50" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="0" y1="-50" x2="50" y2="-15" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="-50" y1="-20" x2="-20" y2="15" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="50" y1="-15" x2="20" y2="15" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="-20" y1="15" x2="20" y2="15" stroke="#06b6d4" stroke-width="1.5"/>
    <line x1="0" y1="-50" x2="0" y2="0" stroke="#22d3ee" stroke-width="2"/>

    <!-- Nodes -->
    <circle cx="0" cy="-50" r="14" fill="#0891b2" stroke="#ffffff" stroke-width="2"/>
    <circle cx="-50" cy="-20" r="10" fill="#0e7490" stroke="#67e8f9" stroke-width="1.5"/>
    <circle cx="50" cy="-15" r="10" fill="#0e7490" stroke="#67e8f9" stroke-width="1.5"/>
    <circle cx="-20" cy="15" r="11" fill="#155e75" stroke="#a5f3fc" stroke-width="1.5"/>
    <circle cx="20" cy="15" r="11" fill="#155e75" stroke="#a5f3fc" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="16" fill="#06b6d4" stroke="#ffffff" stroke-width="2.5"/>

    <!-- Go Text in Center Node -->
    <text x="0" y="5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">GO</text>
  </g>

  <!-- Tag Pill -->
  <rect x="30" y="475" width="140" height="26" rx="4" fill="#083344" stroke="#0e7490" stroke-width="1"/>
  <text x="100" y="492" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#67e8f9" text-anchor="middle" letter-spacing="1">MICROSERVICIOS EN GO</text>

  <!-- Footer Border -->
  <rect x="30" y="520" width="340" height="1" fill="#1e293b"/>

  <!-- Author Area -->
  <text x="30" y="548" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" letter-spacing="1">AUTOR</text>
  <text x="30" y="574" font-family="'Plus Jakarta Sans', Georgia, serif" font-size="20" font-weight="700" fill="#ffffff">
    Matthew Titmus
  </text>
</svg>
