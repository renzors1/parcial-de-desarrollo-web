@if (licenciaDigital) {
  <form name="deleteForm" (ngSubmit)="confirmDelete(licenciaDigital.id)">
    <div class="modal-header">
      <h4 class="modal-title" data-cy="licenciaDigitalDeleteDialogHeading" jhiTranslate="entity.delete.title">
        Confirmar operación de borrado
      </h4>
    </div>

    <div class="modal-body">
      <jhi-alert-error />
      <p
        id="jhi-delete-licenciaDigital-heading"
        jhiTranslate="ejemplo01App.licenciaDigital.delete.question"
        [translateValues]="{ id: licenciaDigital.id }"
      >
        ¿Seguro que quiere eliminar Licencia Digital {{ licenciaDigital.id }}?
      </p>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" (click)="cancel()">
        <fa-icon icon="ban" />&nbsp;<span jhiTranslate="entity.action.cancel">Cancelar</span>
      </button>

      <button id="jhi-confirm-delete-licenciaDigital" data-cy="entityConfirmDeleteButton" type="submit" class="btn btn-danger">
        <fa-icon icon="times" />&nbsp;<span jhiTranslate="entity.action.delete">Eliminar</span>
      </button>
    </div>
  </form>
}
